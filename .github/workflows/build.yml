name: Build duitw Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duitw-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu-latest runner already includes Android command-line tools.
      # Do not use android-actions/setup-android here: its legacy "tools" package
      # request can fail because that SDK package is no longer published.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Android debug signing cache
        run: mkdir -p "$HOME/.android"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: duitw-debug-keystore-v1

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript and prepare offline web bundle
        run: |
          npm test
          npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor and apply Android resources
        run: |
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/duitw.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duitw-apk
          path: release/duitw.apk
          if-no-files-found: error
          retention-days: 30
