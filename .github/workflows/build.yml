
name: Build duitw Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duitw-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: |
          npm test
          npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/duitw.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duitw-apk
          path: release/duitw.apk
          if-no-files-found: error
          retention-days: 30
